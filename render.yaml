services:
  - type: web
    name: estate-security-incident-log
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estate-security-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: estate-security-db
    databaseName: estate_security
    user: estate_security_user
    plan: free
